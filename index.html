<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Перегляд</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <model-viewer id="viewer"
                  ar
                  ar-modes="webxr scene-viewer quick-look"
                  camera-controls
                  auto-rotate
                  shadow-intensity="1"
                  alt="3D модель">
    </model-viewer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const modelFile = params.get('model') || 'cube.glb';
        const tilt = params.get('tilt') || '0deg 0deg 0deg';

        const viewer = document.getElementById('viewer');
        viewer.src = modelFile;
        viewer.orientation = tilt;
    </script>

</body>
</html>
