<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Перегляд</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; background-color: #f4f4f4; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; }
        #status { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #fff; padding: 10px; border-radius: 8px; z-index: 10; font-size: 14px; }
    </style>
</head>
<body>

    <div id="status">Завантаження моделі...</div>

    <model-viewer id="viewer"
                  ar
                  ar-modes="webxr scene-viewer quick-look"
                  camera-controls
                  auto-rotate
                  shadow-intensity="1"
                  alt="3D модель">
    </model-viewer>

    <script>
        const statusBox = document.getElementById('status');
        const viewer = document.getElementById('viewer');
        const params = new URLSearchParams(window.location.search);
        
        const modelFile = params.get('model') || 'test.glb';
        const tilt = params.get('tilt') || '0deg 0deg 0deg';

        statusBox.textContent = 'Завантажую: ' + modelFile;
        viewer.src = modelFile;
        viewer.orientation = tilt;

        viewer.addEventListener('load', () => {
            statusBox.style.display = 'none';
        });

        viewer.addEventListener('error', (event) => {
            statusBox.style.background = '#b00020';
            statusBox.textContent = 'Помилка завантаження ' + modelFile + ': ' + JSON.stringify(event.detail);
        });
    </script>

</body>
</html>
